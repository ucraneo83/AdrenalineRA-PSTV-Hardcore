
name: PSTV experimental VPK build

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  static-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Hardcore static audit
        run: python3 tools/static_guardrails.py

  build:
    needs: static-audit
    runs-on: ubuntu-latest
    container:
      image: vitasdk/vitasdk:latest

    steps:
      - uses: actions/checkout@v4

      - name: Inspect SDK and dependencies
        shell: bash
        run: |
          set -euxo pipefail
          export VITASDK="${VITASDK:-/usr/local/vitasdk}"
          export PATH="$VITASDK/bin:$PATH"
          command -v cmake
          command -v ninja
          command -v vita-make-fself
          test -f "$VITASDK/share/vita.toolchain.cmake"

       - name: Apply GCC 15 taiHEN compatibility fix
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          header = Path(
              "/usr/local/vitasdk/arm-vita-eabi/include/taihen.h"
          )
          source = header.read_text()

          old = "((type(*)())"
          new = "((type(*)(...))"

          count = source.count(old)
          if count != 2:
              raise SystemExit(
                  f"Expected 2 taiHEN casts, found {count}"
              )

          header.write_text(source.replace(old, new))
          print("Patched both taiHEN continuation casts.")
          PY

      - name: Configure and compile
        shell: bash
        run: |
          set -euxo pipefail
          export VITASDK="${VITASDK:-/usr/local/vitasdk}"
          export PATH="$VITASDK/bin:$PATH"
          bash tools/build_pstv.sh 2>&1 | tee build.log

      - name: Collect VPK and checksum
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pstv-experimental-vpk
          path: |
            out/pstv-release/bubble/Adrenaline.vpk
            out/pstv-release/bubble/Adrenaline.vpk.sha256
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
