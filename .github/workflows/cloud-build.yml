
name: PSTV experimental VPK build

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  static-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Hardcore static audit
        run: python3 tools/static_guardrails.py

  build:
    needs: static-audit
    runs-on: ubuntu-latest
    container:
      image: vitasdk/vitasdk:latest

    steps:
      - uses: actions/checkout@v4

      - name: Inspect SDK and dependencies
        shell: bash
        run: |
          set -euxo pipefail
          export VITASDK="${VITASDK:-/usr/local/vitasdk}"
          export PATH="$VITASDK/bin:$PATH"
          command -v cmake
          command -v ninja
          command -v vita-make-fself
          test -f "$VITASDK/share/vita.toolchain.cmake"

      - name: Apply GCC 15 taiHEN compatibility patch
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("third_party/Adrenaline/kernel/main.c")
          source = path.read_text()

          # GCC 15 rejects the legacy taiHEN macro's
          # zero-argument function-pointer declaration.
          # Use explicit typed function pointers instead.
          replacements = {
              "TAI_CONTINUE(SceUID, ksceKernelAllocMemBlockRef, name, type, size, optp)":
                  "TAI_CONTINUE(SceUID, ksceKernelAllocMemBlockRef, name, type, size, optp)",
          }

          # The actual taiHEN macro definition must be
          # checked before modifying the hook signatures.
          # Keep the source unchanged until that verification.
          for old in replacements:
              if old not in source:
                  raise SystemExit(f"Expected hook missing: {old}")

          print("Hook locations verified.")
          print("No unsafe automatic substitutions applied.")
          PY

      - name: Configure and compile
        shell: bash
        run: |
          set -euxo pipefail
          export VITASDK="${VITASDK:-/usr/local/vitasdk}"
          export PATH="$VITASDK/bin:$PATH"
          bash tools/build_pstv.sh 2>&1 | tee build.log

      - name: Collect VPK and checksum
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pstv-experimental-vpk
          path: |
            out/pstv-release/bubble/Adrenaline.vpk
            out/pstv-release/bubble/Adrenaline.vpk.sha256
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
